name: Tests

# The repository had no test suite at all (finding PIPE-02: 0 test files, 0 test
# directories), which is why every defect in the audit shipped silently. This runs
# the suite on every push and pull request.
#
# Scope of the gate today:
#   * schema validation over every record
#   * the invariants the audit proved hold (exchange == EX_<met>_e in 664,218 of
#     664,218 components; coverage.json reproducing the records; the catalogue-count
#     identity across every derived artifact)
#   * the stage harness, tested against planted violations
#   * the build tools' path handling (no dead scratchpad path may return; no tool may
#     default its output to the frozen corpus)
#
# tests/test_defects.py holds one xfail test per defect class still being fixed, with
# its finding id and the stage that owns it. A defect that gets fixed reports XPASS,
# and the marker is then removed so it cannot come back silently. When that ledger is
# empty this job switches to `make test-strict`.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch: {}

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install deps
        run: pip install --quiet pytest pyarrow
      - name: Stage registry is consistent
        run: make check
      - name: CI trigger paths match the Makefile
        # The workflow trigger list is generated from the Makefile and the manifest
        # by tools/build_ci_paths.py. Maintaining it by hand let it name a builder
        # `make derived` no longer runs and omit two it does, so a change to either
        # rebuilt nothing, silently.
        run: make ci-paths-check
      - name: Chain input is present and intact
        # data/_baseline is the corpus the stage chain consumes. Until it was
        # committed the chain's only input was an untracked archive on one machine
        # and `make stages` failed from a fresh clone (PIPE-01, one level up).
        run: python3 tools/baseline.py --verify --deep
      - name: Stage chain over the sample corpus (fast, checks idempotence)
        # Draws the sample from the chain input, so this exercises the stages
        # against the corpus they were written for rather than against their own
        # output.
        run: make stages-sample
      - name: Test suite
        run: make test
      - name: Artifact manifest is current, and describes what is committed
        # --check compares the manifest to the working tree and asserts that every
        # generator it names exists and actually writes the artifact it is credited
        # with. --check-tree compares it to the COMMITTED blobs, which is what
        # catches an artifact that was rebuilt but never staged (data/web).
        run: make manifest-check
