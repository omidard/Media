name: Build data API exports

# Rebuild the derived artifacts whenever the corpus or a builder changes, so the API
# bulk files (data/api/*), the Patterns data (data/cluster/*), the browser payload
# (data/web/*) and the two component-level endpoints never drift from the underlying
# media.
#
# This job calls `make derived`, so the workflow and the documentation cannot
# disagree about what the build is (finding PIPE-02: the README documented one
# command while this workflow ran four, and two builders — build_media_stats.py and
# build_presence_matrix.py — were called by nothing at all, which is why two
# published endpoints shipped 1,128 media stale, finding STALE-01).
#
# It does NOT run the ingest builders or the stage chain. Ingest is network- and
# licence-dependent and would rewrite data/media from upstream on every push; the
# stage chain writes a corrected corpus that a human promotes deliberately
# (`make stages` then `make promote`).
#
# WHAT THIS JOB COMMITS is not a hand-written list any more. It stages exactly the
# artifacts data/MANIFEST.json declares (`build_manifest.py --paths`), because the
# hand-written list is how the browser payload went missing: `make derived` rewrites
# all of data/web/*, the manifest sha256-hashes those files, every page reads them —
# and the commit step did not stage them. The first run would have committed a
# manifest describing a payload it had not committed, and nothing would have failed.
# So after committing, the job re-checks the manifest against the COMMITTED tree
# (`--check-tree`) and fails if they disagree. That check is what makes this class of
# defect loud instead of silent.
#
# LOOP SAFETY is structural rather than asserted. The trigger list below is generated
# from the Makefile and the manifest by tools/build_ci_paths.py, and it excludes every
# path this job writes back. The old list claimed loop-safety in a comment while
# listing data/index.json, which the job both triggers on and commits.

on:
  push:
    branches: [main]
    paths:
      # --- generated by tools/build_ci_paths.py: do not edit by hand ---
      - ".github/workflows/build-api.yml"
      - "Makefile"
      - "build_index.py"
      - "data/media/**"
      - "tools/bigg_metabolite_dict.json"
      - "tools/build_api_exports.py"
      - "tools/build_ci_paths.py"
      - "tools/build_cluster_data.py"
      - "tools/build_coverage_index.py"
      - "tools/build_manifest.py"
      - "tools/build_media_stats.py"
      - "tools/build_presence_matrix.py"
      - "tools/build_web_payload.py"
      - "tools/mediapaths.py"
      - "tools/model_input.py"
      - "tools/refs.py"
      - "tools/verify_reference_tables.py"
      - "tools/web_payload.py"
      # --- end generated ---
  workflow_dispatch: {}

# If several data pushes land in a row, only rebuild once against the latest.
concurrency:
  group: build-api
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build-api:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install deps
        run: pip install --quiet pyarrow scipy numpy pandas pytest

      - name: Stage registry is consistent
        run: make check

      - name: CI trigger paths match the Makefile
        # Finding (d): the paths filter above listed tools/enrich_coverage.py, which
        # `make derived` no longer runs, and omitted build_coverage_index.py and
        # build_web_payload.py, which it does — so editing either builder rebuilt
        # nothing. The list is generated now, and this fails if it drifts again.
        run: make ci-paths-check

      - name: Rebuild derived data
        # One command. The dependency order lives in the Makefile, where it is
        # documented and testable, not in a comment in this file.
        run: make derived

      - name: No build step wrote the corpus
        # The Makefile's contract is that nothing under `derived` touches the corpus —
        # data/media and anything a transform stage writes (data/refs.json). Only
        # `make promote` may. If that stops being true, this job would silently commit
        # a corpus edit as a "derived artifact". The list comes from the manifest, so
        # a new corpus-level file is covered the moment it is declared.
        run: |
          set -euo pipefail
          python3 tools/build_manifest.py --corpus-paths > /tmp/corpus_paths.txt
          echo "corpus paths that must be untouched:"; cat /tmp/corpus_paths.txt
          if ! xargs -r -a /tmp/corpus_paths.txt git diff --quiet --; then
            echo "make derived modified the corpus — that is promotion, not a rebuild:"
            xargs -r -a /tmp/corpus_paths.txt git diff --stat -- | tail -20
            exit 1
          fi
          echo "corpus untouched by make derived."

      - name: Tests (schema, invariants, harness, tools)
        # The defect ledger in tests/test_defects.py is xfail while the correction
        # stages land, so this gate is green on the current data and turns red the
        # moment a passing invariant regresses. It becomes `make test-strict` once
        # the ledger is empty.
        run: make test

      - name: Commit refreshed artifacts (if changed)
        run: |
          set -euo pipefail
          if git diff --quiet -- data; then
            echo "derived artifacts unchanged — nothing to commit."
            exit 0
          fi
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # The staging list comes from data/MANIFEST.json, which is the declaration
          # of what this build produces. Relocating or adding an artifact updates
          # what CI commits automatically; a hand-written list does not.
          python3 tools/build_manifest.py --paths > /tmp/artifact_paths.txt
          echo "staging $(wc -l < /tmp/artifact_paths.txt) declared artifact paths:"
          cat /tmp/artifact_paths.txt
          xargs -r -a /tmp/artifact_paths.txt git add --
          git add data/MANIFEST.json
          git commit -m "chore(data): rebuild derived artifacts via make derived"
          # Everything the build touched must now be committed. A leftover
          # modification means an artifact the manifest does not declare — the exact
          # shape of the data/web defect — so fail loudly instead of leaving it.
          if ! git diff --quiet -- data; then
            echo "these files changed but are not declared in data/MANIFEST.json:"
            git diff --name-only -- data
            exit 1
          fi
          # And the manifest must describe what was actually committed, not what was
          # merely built.
          python3 tools/build_manifest.py --check-tree
          # Rebase onto any commits that landed while we were building, then push.
          # A few retries handle races with concurrent data pushes.
          for i in 1 2 3 4 5; do
            if git push origin HEAD:main; then
              echo "pushed on attempt $i"; exit 0
            fi
            echo "push $i failed; rebasing on latest main"
            git fetch origin main
            git rebase origin/main || { git rebase --abort; exit 1; }
          done
          echo "could not push after retries"; exit 1
