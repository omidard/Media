; MediaDB — pytest configuration.
;
; `make test` runs `pytest tests`. A contributor who runs a bare `pytest` from the
; repository root got a collection ERROR instead of a suite:
;
;   ERROR collecting tools/stages/tests/test_stage_naming.py
;   import file mismatch: imported module 'test_stage_naming' has this __file__
;   attribute: /data/media_curate/tests/test_stage_naming.py
;
; Two files shared a basename, and pytest's default `prepend` import mode keys test
; modules by basename, so the second one could not be imported and collection was
; interrupted — 229 tests, 0 run. The duplicate was a pointer file with no tests in it
; and is now tools/stages/tests/README.md, but the trap is structural: any two
; test_*.py files with the same basename anywhere in the tree bring it back.
;
;   --import-mode=importlib keys modules by path, not basename, so a duplicate
;                           basename is no longer a collection error. It is a
;                           command-line option with no ini key of its own, so it
;                           goes in addopts; `import-mode = importlib` here is
;                           silently ignored with a PytestConfigWarning.
;   testpaths=tests         a bare `pytest` runs exactly what `make test` runs.
;                           Tests live in tests/ only; tools/stages/tests/ holds a
;                           README explaining where they went.
;
; Neither option changes which tests exist or how they behave — `make test` collected
; the same 216 before this file was added. conftest.py still puts tools/ and
; tools/stages/ on sys.path, and --corpus / --limit are unaffected.

[pytest]
testpaths = tests
addopts = --import-mode=importlib
