openapi: 3.1.0
info:
  title: Media Data API
  version: "1.0.0"
  description: >
    Read-only static API for the Media dataset: a curated, citation-backed library of
    growth / simulation media whose components carry BiGG exchange reactions
    (EX_<met>_e) so a genome-scale model can adopt a medium. 664,000 of 665,582
    component records (99.8%) reach a BiGG exchange; 1,364 carry a
    ModelSEED/MetaNetX/KEGG fallback id that no BiGG model will accept, and 218 carry
    no exchange at all. 656,625 of 665,582 (98.7%) carry a cross-reference.
    6,827 of 13,515 media (50.5%) hand a model a constraint set identical to at least
    one other record; see model_input_signature. Served over GitHub Pages with
    permissive CORS; no authentication and no rate limiting.
  license:
    # Code is MIT. The DATA is not under a single licence: it is per upstream source,
    # and 1,189 of 13,515 records (8.8%) may not be used commercially. This field can
    # hold only one value, so it names the code licence and points at the schedule.
    name: MIT (code only; data is per-source — see LICENSE and tools/licenses.tsv)
    url: https://github.com/omidard/Media/blob/main/LICENSE
servers:
  - url: https://omidard.github.io/Media
    description: GitHub Pages (production)
paths:
  /data/index.json:
    get:
      summary: Catalog of all media (summaries)
      operationId: getCatalog
      responses:
        "200":
          description: Catalog with totals and one summary per medium.
          content:
            application/json:
              schema:
                type: object
                properties:
                  count: { type: integer }
                  by_category:
                    type: object
                    additionalProperties: { type: integer }
                  by_source_db:
                    type: object
                    additionalProperties: { type: integer }
                  media:
                    type: array
                    items: { $ref: "#/components/schemas/MediumSummary" }
  /data/media/{id}.json:
    get:
      summary: Full record for a single medium
      operationId: getMedium
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
          description: Medium id, e.g. m9_glucose_aerobic
      responses:
        "200":
          description: Full medium record including components and provenance.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Medium" }
        "404":
          description: No medium with that id.
  /data/media_stats.json:
    get:
      summary: Component-frequency statistics
      operationId: getMediaStats
      responses:
        "200": { description: Aggregate component statistics. }
  /data/presence_matrix.json:
    get:
      summary: Medium x component presence matrix
      operationId: getPresenceMatrix
      responses:
        "200": { description: Presence matrix. }
  /data/api/manifest.json:
    get:
      summary: API manifest (version, totals, bulk-file inventory, schemas)
      operationId: getManifest
      responses:
        "200": { description: Manifest object. }
  /data/api/media.parquet:
    get:
      summary: Bulk media table (Parquet, one row per medium)
      operationId: getMediaParquet
      responses:
        "200":
          description: Parquet file; queryable in place over HTTP (e.g. DuckDB httpfs).
          content:
            application/octet-stream:
              schema: { type: string, format: binary }
  /data/api/components.parquet:
    get:
      summary: Bulk components table (Parquet, one row per medium-component)
      operationId: getComponentsParquet
      responses:
        "200":
          description: Parquet file; join to media on medium_id.
          content:
            application/octet-stream:
              schema: { type: string, format: binary }
  # media.sqlite.gz and media.jsonl.part*.gz USED TO BE SERVED HERE and are not any
  # more. They are a second and third encoding of a corpus this host already serves
  # one record at a time, they measured 172.8 MiB, and GitHub Pages refuses a
  # published site over 1 GiB.
  #
  # They are NOT hosted anywhere yet: the `data-v1` release is planned and has not
  # been created, so do not send a client to
  # https://github.com/omidard/Media/releases/download/data-v1/... — it answers 404.
  # Build them from a clone instead, offline, from the committed corpus:
  #
  #     make release-assets      # -> dist/api/
  #
  # /data/api/manifest.json -> bulk_download.status ("planned" | "published") is the
  # machine-readable authority, with the file list and the local build command.
  # Nothing became unavailable: the parquet pair below is still served here and
  # DuckDB queries it in place over HTTP, every full record is still at
  # /data/media/{id}.json, and pymediadb.iter_full_records() walks that endpoint
  # whenever the release is unpublished or an advertised asset is unreachable.
  /data/refs.json:
    get:
      summary: Cross-reference blocks and prose notes, held once
      operationId: getRefs
      description: >
        The join target for components[].xref_id, components[].mapping_note_id and
        components[].xref_note_id. 2,291 distinct cross-reference blocks stand in for
        the 656,625 of 665,582 components (98.7%) that carry one — 8,957 carry none —
        and 113 distinct sentences for 621,274; holding them once is
        what keeps this site inside GitHub Pages' 1 GiB limit. Fetch once and cache:
        it is 0.6 MB and changes only when the corpus does.
      responses:
        "200":
          description: >
            { schema, joins, n_xrefs, n_notes, xrefs: {key: {inchikey, kegg, chebi,
            hmdb, mnx, seed, biocyc, formula, inchi, ...}}, notes: {key: text} }.
            An xref key is the BiGG metabolite id where that id has one block in the
            corpus, and <bigg>~<hash> where it has several.
          content:
            application/json:
              schema: { type: object }
components:
  schemas:
    MediumSummary:
      type: object
      properties:
        id: { type: string }
        name: { type: string }
        category:
          type: string
          enum: [food, laboratory, biospecimen, minimal, defined, rich, dietary, niche]
        organism_scope: { type: string }
        aerobic:
          type: boolean
          nullable: true
          description: >-
            true | false | null. 439 media have no stated oxygen requirement;
            those must read as unknown, not as anaerobic (UX-01).
        n_components: { type: integer }
        n_mapped: { type: integer }
        n_in_biggr: { type: integer }
        n_nonbigg_fallback:
          type: integer
          description: >-
            Components whose exchange id is a ModelSEED/MetaNetX/KEGG fallback rather
            than a BiGG id. No BiGG model will accept it. 1,364 of 665,582 components
            library-wide.
        n_no_exchange:
          type: integer
          description: >-
            Components with no exchange reaction at all. 218 of 665,582 library-wide.
        pct_sourced_components_with_bigg_id:
          type: number
          nullable: true
          description: >-
            Of the components the cited source states, the share that reached a BiGG
            metabolite id. Its denominator is components the record already carries,
            NOT the source's ingredient list, so it is 100.0 on 12,861 of 13,515
            records and is not a coverage measure; use pct_covered_source for that.
            RENAMED from pct_covered_observed on 2026-09-06; data/index.json carries
            a field_renames block. null means the denominator was zero, never 100.
        model_input_signature:
          type: string
          description: >-
            Hash of the set of (exchange, lower_bound, upper_bound) triples this
            record hands a model. Records sharing it are indistinguishable to a
            solver. 8,311 distinct values across 13,515 media.
        n_media_with_identical_model_input:
          type: integer
          description: >-
            How many OTHER media produce the identical model input. 0 means unique.
            6,827 of 13,515 media (50.5%) are non-zero. The complete groups are
            published at /data/web/twins.json.
        namespace: { type: string, examples: [bigg] }
        source_type: { type: string }
        source_db: { type: string }
        defined:
          type: boolean
          nullable: true
          description: >-
            true | false | null. null means nobody recorded it (9,798 records),
            not "not defined", and it is never inferred from mapping coverage.
            The catalog previously emitted "" for these, which is falsy and
            violated this boolean contract (SCHEMA-03).
        citation: { type: string }
        food_group: { type: string }
    Medium:
      type: object
      properties:
        id: { type: string }
        name: { type: string }
        category: { type: string }
        organism_scope: { type: string }
        aerobic:
          type: boolean
          nullable: true
          description: >-
            true | false | null. 439 media have no stated oxygen requirement;
            those must read as unknown, not as anaerobic (UX-01).
        description: { type: string }
        namespace: { type: string }
        defined:
          type: boolean
          nullable: true
          description: >-
            true | false | null. null means nobody recorded it (9,798 records),
            not "not defined", and it is never inferred from mapping coverage.
            The catalog previously emitted "" for these, which is falsy and
            violated this boolean contract (SCHEMA-03).
        source_db: { type: string }
        food_group: { type: string }
        n_components: { type: integer }
        n_mapped: { type: integer }
        n_in_biggr: { type: integer }
        provenance: { $ref: "#/components/schemas/Provenance" }
        components:
          type: array
          items: { $ref: "#/components/schemas/Component" }
        n_nonbigg_fallback:
          type: integer
          description: >-
            Components carrying a ModelSEED/MetaNetX/KEGG fallback exchange instead of a
            BiGG one. n_mapped counts BiGG-mapped components only. 1,364 of 665,582
            components library-wide; the component's own mapping_note says no BiGG
            model will accept the id.
        n_unmappable:
          type: integer
          description: >-
            Components with no exchange reaction at all: identity was never established
            (evidence_tier unmapped) or the ingredient is an undefined mixture
            (unmappable_mixture). 218 of 665,582 library-wide. n_mapped +
            n_nonbigg_fallback + n_unmappable = n_components.
        pct_sourced_components_with_bigg_id:
          type: number
          nullable: true
          description: >-
            Of the components the cited source states, the share that reached a BiGG
            metabolite id. NOT a coverage measure: its denominator is components, not
            the source's ingredient list. RENAMED from pct_covered_observed on
            2026-09-06, and the rename lives in the transform chain (stage
            40_remap_components), so every one of the 13,515 published records carries
            the new key and none carries the old one. null means the denominator was
            zero, never 100.
        uncovered:
          type: array
          description: >-
            Components that could not be given an exchange (never silently dropped).
            Named `unmapped` in earlier documentation; that field is present in 0 of the
            13,515 shipped records.
          items: { type: object }
    Provenance:
      type: object
      properties:
        source_type: { type: string }
        citation: { type: string }
        doi: { type: string }
        url: { type: string }
        notes: { type: string }
    Component:
      type: object
      properties:
        name: { type: string }
        bigg_metabolite:
          type: [string, "null"]
          description: BiGG metabolite id; null if unmapped.
        exchange: { type: string, examples: [EX_glc__D_e] }
        lower_bound:
          type: number
          description: Flux lower bound; negative = uptake (mmol/gDW/h).
        upper_bound: { type: number }
        concentration_mM: { type: [number, "null"] }
        in_biggr: { type: boolean }
        mapping_method: { type: string }
        mapping_confidence: { type: string }
        # Cross-references and prose notes are held ONCE in /data/refs.json and
        # referenced by key. 2,291 distinct cross-reference blocks were written into
        # the 656,625 of 665,582 components that carry one and 113 distinct sentences
        # into 621,274 of them,
        # which was 490 MiB of a site GitHub Pages caps at 1 GiB. Join
        # refs.xrefs[xref_id] and refs.notes[<note id>]. The parquet and SQLite
        # exports are unaffected: xref_inchikey, xref_kegg and the rest are still
        # first-class columns there.
        xref_id:
          type: string
          description: >-
            Key into /data/refs.json -> xrefs. The block describes the BiGG id
            that was CHOSEN for this component; whether it was also the evidence
            for that choice is stated by match_field / match_key / source_xref.
            ABSENT means the component has no cross-references at all (8,957 of
            665,582); it never means "look elsewhere".
          examples: [glc__D, "ca2~0afa"]
        mapping_note_id:
          type: [string, "null"]
          description: Key into /data/refs.json -> notes; the verbatim note.
          examples: [n168faf]
        xref_note_id:
          type: [string, "null"]
          description: >-
            Key into /data/refs.json -> notes. Present on 654,067 of 665,582
            components, carrying the sentence "these cross-references describe
            the BiGG id that was chosen; they were not used to choose it and
            cannot contradict it".
          examples: [n6d132e]
